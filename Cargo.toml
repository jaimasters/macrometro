[package]
name = "macrometro"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
bevy = "0.20.0"

[dependencies]
bevy.workspace = true
app = { path = "crates/app" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
