[package]
name = "app"
version = "0.1.0"
edition.workspace = true
description = "Composes all feature plugins into the game."

[dependencies]
bevy.workspace = true
sim_core = { path = "../sim_core" }
world_gen = { path = "../world_gen" }
transit = { path = "../transit" }
growth = { path = "../growth" }
city = { path = "../city" }
economy = { path = "../economy" }
render_budget = { path = "../render_budget" }
save = { path = "../save" }
ui_tools = { path = "../ui_tools" }
sound = { path = "../sound" }
serde = { version = "1", features = ["derive"] }
ron = "0.12"

# System UI font for the HUD (native only; wasm keeps Bevy's built-in font).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = ["system_font_discovery"] }

# Browser save slot (localStorage) and page reload for Reset.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage", "Location"] }
